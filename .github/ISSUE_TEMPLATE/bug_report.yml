name: Bug report
description: Something in Directory does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. A screenshot of the pane helps a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
      placeholder: 2.1.316
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Directory version
      description: Shown by `claude plugin list`
      placeholder: 0.3.0
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      placeholder: Windows Terminal, iTerm2, Ghostty, VS Code terminal…
