  <text x="480" y="26" text-anchor="middle" class="sub">claude — my-app</text>
  <line x1="0" y1="44" x2="960" y2="44" stroke="#24221f"/>

  <!-- Chat -->
  <text x="28" y="84" class="you">&gt; add token refresh to the auth session</text>
  <text x="28" y="120"><tspan class="claude">●</tspan> I'll add a refresh helper and call it when</text>
  <text x="44" y="140">a session is within five minutes of expiry.</text>
  <text x="28" y="176"><tspan class="claude">●</tspan> <tspan class="bold">Read</tspan><tspan class="dim">(package.json)</tspan></text>
  <text x="28" y="200"><tspan class="claude">●</tspan> <tspan class="bold">Write</tspan><tspan class="dim">(src/auth/token.ts)</tspan></text>
  <text x="44" y="220" class="dim">⎿  Wrote 38 lines</text>
  <text x="28" y="244"><tspan class="claude">●</tspan> <tspan class="bold">Update</tspan><tspan class="dim">(src/auth/session.ts)</tspan></text>
  <text x="44" y="264" class="dim">⎿  Updated with 12 additions</text>
  <text x="28" y="300"><tspan class="claude">●</tspan> Sessions now refresh their token before</text>
  <text x="44" y="320">expiry. Tests pass.</text>
  <rect x="24" y="452" width="516" height="40" rx="8" fill="none" stroke="#2f2c29"/>
  <text x="40" y="477" class="dim">&gt; <tspan class="you">@src/auth/token.ts</tspan> explain the refresh window</text>

  <!-- Pane -->
  <line x1="564" y1="44" x2="564" y2="520" stroke="#2a2826"/>
  <text x="584" y="80" class="bold">my-app</text>
