<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="A terminal with a Claude Code chat on the left and the Directory pane on the right, showing a file tree and the files Claude edited this session">
  <style>
    text { white-space: pre; font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; fill: #d6d3cf; }
    .dim { fill: #8a8580; }
    .sub { fill: #5b5753; }
    .claude { fill: #d97757; }
    .bold { font-weight: 600; }
    .you { fill: #b7b2ac; }
  </style>
  <rect width="960" height="520" rx="14" fill="#151413"/>
  <rect x="0.5" y="0.5" width="959" height="519" rx="13.5" fill="none" stroke="#2a2826"/>
