  <text x="584" y="162"><tspan class="claude">◆</tspan> <tspan class="dim">created</tspan> src/auth/token.ts<tspan x="922" text-anchor="end" class="dim">1m</tspan></text>
  <text x="584" y="182">  <tspan class="dim">read   </tspan> package.json<tspan x="922" text-anchor="end" class="dim">2m</tspan></text>
  <text x="584" y="204" class="sub">────────────────────────────────────────────────</text>
  <text x="584" y="226"><tspan class="sub">▸ </tspan><tspan class="dim">.github</tspan></text>
  <text x="584" y="246"><tspan class="sub">▾ </tspan>src<tspan x="922" text-anchor="end" class="sub">◆</tspan></text>
  <text x="584" y="266"><tspan class="sub">│ ▾ </tspan>auth<tspan x="922" text-anchor="end" class="sub">◆</tspan></text>
  <rect x="580" y="273" width="348" height="20" rx="3" fill="#2a2724"/>
  <text x="584" y="288"><tspan class="sub">│ │   </tspan><tspan class="bold">session.ts</tspan><tspan x="922" text-anchor="end" class="claude">◆</tspan></text>
  <text x="584" y="308"><tspan class="sub">│ │   </tspan>token.ts<tspan x="922" text-anchor="end" class="claude">◆</tspan></text>
  <text x="584" y="328"><tspan class="sub">│ ▸ </tspan>routes</text>
